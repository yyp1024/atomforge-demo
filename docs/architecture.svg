<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101830"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="900" height="640" rx="16" fill="url(#bg)"/>
  <text x="36" y="46" fill="#e2e8f0" font-size="22" font-weight="700">AtomForge 架构</text>
  <text x="36" y="70" fill="#64748b" font-size="13">智能体驱动的应用生成器 · 单文件零依赖 · 规则引擎 + LLM 预留</text>

  <!-- 层 1：UI -->
  <rect x="30" y="96" width="840" height="96" rx="12" fill="#111a2e" stroke="#2dd4bf" stroke-opacity="0.45"/>
  <text x="48" y="124" fill="#2dd4bf" font-size="14" font-weight="700">UI 层</text>
  <g font-size="12" fill="#cbd5e1">
    <rect x="48" y="138" width="180" height="40" rx="8" fill="#0d1526" stroke="#1e293b"/>
    <text x="138" y="163" text-anchor="middle">Home 首页</text>
    <rect x="248" y="138" width="180" height="40" rx="8" fill="#0d1526" stroke="#1e293b"/>
    <text x="338" y="163" text-anchor="middle">Workbench 工作台</text>
    <rect x="448" y="138" width="180" height="40" rx="8" fill="#0d1526" stroke="#1e293b"/>
    <text x="538" y="163" text-anchor="middle">代码面板 · 设置</text>
    <rect x="648" y="138" width="190" height="40" rx="8" fill="#0d1526" stroke="#1e293b"/>
    <text x="743" y="163" text-anchor="middle">分享 / 导入 / 下载</text>
  </g>

  <!-- 层 2：交互 -->
  <rect x="30" y="212" width="840" height="96" rx="12" fill="#111a2e" stroke="#8b5cf6" stroke-opacity="0.45"/>
  <text x="48" y="240" fill="#8b5cf6" font-size="14" font-weight="700">交互层</text>
  <g font-size="12" fill="#cbd5e1">
    <rect x="48" y="254" width="180" height="40" rx="8" fill="#0d1526" stroke="#1e293b"/>
    <text x="138" y="279" text-anchor="middle">hash 路由 + 重渲染</text>
    <rect x="248" y="254" width="180" height="40" rx="8" fill="#0d1526" stroke="#1e293b"/>
    <text x="338" y="279" text-anchor="middle">新手引导 · 昵称</text>
    <rect x="448" y="254" width="180" height="40" rx="8" fill="#0d1526" stroke="#1e293b"/>
    <text x="538" y="279" text-anchor="middle">多标签 storage 同步</text>
    <rect x="648" y="254" width="190" height="40" rx="8" fill="#0d1526" stroke="#1e293b"/>
    <text x="743" y="279" text-anchor="middle">toast / 流水线动画</text>
  </g>

  <!-- 层 3：Agent 引擎 -->
  <rect x="30" y="328" width="840" height="112" rx="12" fill="#111a2e" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="48" y="356" fill="#f59e0b" font-size="14" font-weight="700">Agent 引擎（ENG）</text>
  <g font-size="12" fill="#cbd5e1">
    <rect x="48" y="370" width="150" height="54" rx="8" fill="#0d1526" stroke="#1e293b"/>
    <text x="123" y="392" text-anchor="middle" fill="#e2e8f0">parse()</text>
    <text x="123" y="410" text-anchor="middle" fill="#64748b">意图解析</text>
    <rect x="218" y="370" width="150" height="54" rx="8" fill="#0d1526" stroke="#1e293b"/>
    <text x="293" y="392" text-anchor="middle" fill="#e2e8f0">plan()</text>
    <text x="293" y="410" text-anchor="middle" fill="#64748b">6 步流水线</text>
    <rect x="388" y="370" width="150" height="54" rx="8" fill="#0d1526" stroke="#1e293b"/>
    <text x="463" y="392" text-anchor="middle" fill="#e2e8f0">synthesize()</text>
    <text x="463" y="410" text-anchor="middle" fill="#64748b">8 模板构建器</text>
    <rect x="558" y="370" width="150" height="54" rx="8" fill="#0d1526" stroke="#1e293b"/>
    <text x="633" y="392" text-anchor="middle" fill="#e2e8f0">迭代意图识别</text>
    <text x="633" y="410" text-anchor="middle" fill="#64748b">换色/换肤/改名</text>
    <rect x="728" y="370" width="122" height="54" rx="8" fill="#3b2508" stroke="#f59e0b" stroke-dasharray="4 3"/>
    <text x="789" y="392" text-anchor="middle" fill="#fbbf24">LLM 预留</text>
    <text x="789" y="410" text-anchor="middle" fill="#b45309" font-size="11">ENG.LLM.enabled</text>
  </g>

  <!-- 层 4：沙箱 + 存储 -->
  <rect x="30" y="460" width="840" height="150" rx="12" fill="#111a2e" stroke="#64748b" stroke-opacity="0.5"/>
  <text x="48" y="488" fill="#94a3b8" font-size="14" font-weight="700">沙箱与存储</text>
  <g font-size="12" fill="#cbd5e1">
    <rect x="48" y="502" width="250" height="88" rx="8" fill="#0d1526" stroke="#1e293b"/>
    <text x="173" y="524" text-anchor="middle" fill="#e2e8f0">沙箱预览</text>
    <text x="173" y="546" text-anchor="middle" fill="#64748b">iframe srcdoc 隔离渲染</text>
    <text x="173" y="566" text-anchor="middle" fill="#64748b">生成应用自带 af-* 存储</text>
    <rect x="318" y="502" width="250" height="88" rx="8" fill="#0d1526" stroke="#1e293b"/>
    <text x="443" y="524" text-anchor="middle" fill="#e2e8f0">持久化</text>
    <text x="443" y="546" text-anchor="middle" fill="#64748b">localStorage 项目/设置/引导</text>
    <text x="443" y="566" text-anchor="middle" fill="#64748b">下载 HTML · JSON 备份</text>
    <rect x="588" y="502" width="262" height="88" rx="8" fill="#0d1526" stroke="#1e293b"/>
    <text x="719" y="524" text-anchor="middle" fill="#e2e8f0">分享链路</text>
    <text x="719" y="546" text-anchor="middle" fill="#64748b">参数压缩 base64url → hash</text>
    <text x="719" y="566" text-anchor="middle" fill="#64748b">新窗口导入 → 按模板重建</text>
  </g>
</svg>
